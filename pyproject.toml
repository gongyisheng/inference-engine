[project]
name = "inference-engine"
version = "0.1.0"
description = "A learning LLM inference engine in the spirit of nano-vllm / mini-sglang"
authors = [
    { name = "gongyisheng", email = "yishenggong9437@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.17.0",
    "numpy>=2.4.4",
    "safetensors>=0.7.0",
    "torch>=2.11.0",
    "transformers>=5.9.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
